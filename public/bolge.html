    .villa-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--white);transition:box-shadow 0.25s,transform 0.25s;cursor:pointer}

    .villa-img{height:180px;position:relative;overflow:hidden}
    .villa-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s}
    .villa-card:hover .villa-img img{transform:scale(1.05)}
    .villa-img-ph{width:100%;height:100%;background:linear-gradient(135deg,#1a4a6e,#4a90c4)}
    .villa-badge{position:absolute;top:10px;left:10px;background:#fff;font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;color:var(--blue)}

    .villa-btn:hover{background:var(--blue);color:#fff}

    /* SAĞ PANEL */
    .sidebar-card{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:20px;margin-bottom:16px}

    .filter-chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;background:var(--white);transition:all 0.15s;margin-bottom:8px;font-family:'DM Sans',sans-serif;width:100%;text-align:left}

    .faq-q{padding:14px 18px;font-size:14px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--white)}
    .faq-q:hover{background:#f9f9f9}
    .faq-a{padding:0 18px;font-size:13px;color:#555;line-height:1.7;max-height:0;overflow:hidden;transition:max-height 0.3s,padding 0.3s}
    .faq-item.open .faq-a{max-height:300px;padding:12px 18px}
    .faq-arrow{transition:transform 0.3s;font-size:12px;color:var(--muted)}
    .faq-item.open .faq-arrow{transform:rotate(180deg)}

    footer{background:#111;color:rgba(255,255,255,0.5);text-align:center;padding:24px;font-size:12px}
    .loading{text-align:center;padding:60px;color:var(--muted);grid-column:1/-1}

const REGION_DATA = currentLang === 'en' ? REGION_DATA_EN : REGION_DATA_TR;

function renderRegion() {
const REGION_DATA = currentLang === 'en' ? REGION_DATA_EN : REGION_DATA_TR;
const data = REGION_DATA[region] || REGION_DATA['Bodrum'];

// Meta güncelle
document.title = (currentLang === 'en' ? region + ' Villa Rentals | Pool & Sea View — bizebivilla' : region + ' Kiralık Villa | Havuzlu & Deniz Manzaralı — bizebivilla');
document.getElementById('meta-desc').content = data.meta;
document.getElementById('meta-canonical').href = 'https://bizebivilla.com/bolge.html?bolge=' + region;
document.getElementById('og-title').content = region + ' Kiralık Villa — bizebivilla';
document.getElementById('og-desc').content = data.meta;
document.getElementById('og-image').content = data.hero;
document.getElementById('page-title').textContent = region + ' Kiralık Villa — bizebivilla';

// Hero
document.getElementById('hero-bg').style.backgroundImage = "url('" + data.hero + "')";
document.getElementById('hero-badge').textContent = data.badge;
document.getElementById('hero-title').innerHTML = data.titlePre + ' <em>' + data.titleEm + '</em>';
document.getElementById('hero-sub').textContent = data.sub;
document.getElementById('bc-region').textContent = region + (currentLang==='en'?' Villa Rental':' Kiralık Villa');

// Breadcrumb schema
const bcSchema = {
  '@context': 'https://schema.org',
  '@type': 'BreadcrumbList',
  'itemListElement': [
    {'@type':'ListItem','position':1,'name':'Ana Sayfa','item':'https://bizebivilla.com/'},
    {'@type':'ListItem','position':2,'name':'Bölgeler','item':'https://bizebivilla.com/#regions'},
    {'@type':'ListItem','position':3,'name':region+' Kiralık Villa','item':'https://bizebivilla.com/bolge.html?bolge='+region}
  ]
};
const s = document.createElement('script'); s.type='application/ld+json';
s.textContent = JSON.stringify(bcSchema); document.head.appendChild(s);

// Stats
const statsEl = document.getElementById('region-stats');
statsEl.innerHTML = '<div class="sc-title" id="stats-title">' + region + ' Bilgileri</div>' +
  data.stats.map(([l,v]) => '<div class="sc-item"><span class="sc-label">'+l+'</span><span class="sc-val">'+v+'</span></div>').join('');

// SEO İçerik
document.getElementById('seo-content').innerHTML = data.content +
  (currentLang==='en'?'<h2>Frequently Asked Questions</h2>':'<h2>Sık Sorulan Sorular</h2>') +
  data.faq.map(([q,a]) => `<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">${q}<span class="faq-arrow">▼</span></div><div class="faq-a">${a}</div></div>`).join('');

// FAQ Schema
const faqSchema = {
  '@context': 'https://schema.org',
  '@type': 'FAQPage',
  'mainEntity': data.faq.map(([q,a]) => ({'@type':'Question','name':q,'acceptedAnswer':{'@type':'Answer','text':a}}))
};
const fs2 = document.createElement('script'); fs2.type='application/ld+json';
fs2.textContent = JSON.stringify(faqSchema); document.head.appendChild(fs2);

} // renderRegion sonu

renderRegion();

function toggleFaq(el) {
  el.parentElement.classList.toggle('open');
}

// Villalar
let allVillas = [];
async function loadVillas(filter) {
  const grid = document.getElementById('villa-grid');
  grid.innerHTML = `<div class="loading">${currentLang==='en'?'Loading...':'Yükleniyor...'}</div>`;
  try {
    const q = new URLSearchParams({ region });
    if (filter === 'pool')      q.set('pool','true');
    if (filter === 'seaView')   q.set('seaView','true');
    if (filter === 'beachfront')q.set('beachfront','true');
    const res  = await fetch('http://localhost:3001/api/villas?' + q.toString());
    const json = await res.json();
    allVillas  = json.data || [];
    if (!allVillas.length) { grid.innerHTML = `<div class="loading">${currentLang==='en'?'No villas in this region.':'Bu bölgede villa bulunamadı.'}</div>`; return; }
    grid.innerHTML = allVillas.map(v => {
      const cover = v.photos?.find(p=>p.isCover)?.url || v.photos?.[0]?.url;
      return `<div class="villa-card" onclick="window.location.href='villa.html?slug=${v.slug}'">
        <div class="villa-img">
          ${cover?`<img src="${cover}" alt="${v.title}" loading="lazy">`:'<div class="villa-img-ph"></div>'}
          ${v.isFeatured?`<div class="villa-badge">${currentLang==='en'?'Featured':'Öne Çıkan'}</div>`:''}
        </div>
        <div class="villa-body">
          <div class="villa-loc">${v.location.region}${v.location.district?' · '+v.location.district:''}</div>
          <div class="villa-name">${(currentLang==='en' && v.title_en) ? v.title_en : v.title}</div>
          <div class="villa-feats">
            <span class="villa-feat">🛏 ${v.capacity.bedrooms} ${currentLang==='en'?'beds':'yatak'}</span>
            <span class="villa-feat">👥 ${v.capacity.guests} ${currentLang==='en'?'guests':'kişi'}</span>
            ${v.amenities.pool?`<span class="villa-feat">🏊 ${currentLang==="en"?"Pool":"Havuz"}</span>`:''}
            ${v.amenities.seaView?`<span class="villa-feat">🌊 ${currentLang==="en"?"Sea":"Deniz"}</span>`:''}
          </div>
          <div class="villa-footer">
            <div class="villa-price">₺${v.pricing.nightly.toLocaleString('tr-TR')} <span>${currentLang==='en'?'/ night':'/ gece'}</span></div>
            <a href="villa.html?slug=${v.slug}" class="villa-btn" onclick="event.stopPropagation()">${currentLang==='en'?'View':'İncele'}</a>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch(e) { grid.innerHTML = `<div class="loading">${currentLang==='en'?'Connection error.':'Bağlantı hatası.'}</div>`; }
}

function applyFilter(filter, btn) {
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  loadVillas(filter);
}

loadVillas(null);

const origSetLang = window.setLang;
if (origSetLang) {
  window.setLang = function(lang) {
    origSetLang(lang);
    renderRegion();
    loadVillas(null);
  };
}
