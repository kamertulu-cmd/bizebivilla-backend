<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Başarılı — bizebivilla</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f3ef; color: #1a1a1a; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
  .container { max-width: 560px; margin: 0 auto; padding: 40px 20px; flex: 1; width: 100%; }
  .logo { text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 32px; }
  .logo .bi { color: #1a8fd9; }
  .card { background: white; border-radius: 14px; padding: 40px 32px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .success-icon { width: 72px; height: 72px; margin: 0 auto 20px; background: #dcfce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .success-icon svg { width: 36px; height: 36px; color: #16a34a; }
  h1 { font-size: 22px; margin-bottom: 10px; }
  p { color: #555; margin-bottom: 12px; }
  .summary { background: #f8fafc; border-radius: 10px; padding: 16px 20px; margin: 24px 0; text-align: left; }
  .summary-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .summary-row .label { color: #666; }
  .summary-row.total { padding-top: 10px; border-top: 1px solid #e5e5e5; margin-top: 8px; font-weight: 600; color: #1a8fd9; }
  .note { background: #fff7e6; border-left: 4px solid #f5a623; padding: 14px 18px; border-radius: 8px; margin: 20px 0; text-align: left; font-size: 13px; color: #555; }
  .btn { display: inline-block; background: #1a8fd9; color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; margin-top: 8px; transition: background 0.15s; }
  .btn:hover { background: #1577b8; }
  .loading { color: #888; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">bize<span class="bi">bi</span>villa</div>

  <div class="card">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Ödemeniz başarıyla alındı! 🎉</h1>
    <p>Rezervasyonunuz kesinleşti, e-posta adresinize onay mesajı gönderildi.</p>

    <div id="details" class="loading">Bilgiler yükleniyor...</div>

    <div class="note" id="note" style="display:none">
      <strong>Eve giriş gününüzde:</strong> Kalan tutarı doğrudan villa sahibine ödeyeceksiniz. Sahip sizinle iletişime geçecek.
    </div>

    <a href="/" class="btn">Ana Sayfa</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const inquiryId = params.get('id');
  const fmt = n => Number(n).toLocaleString('tr-TR') + ' ₺';
  const fmtDate = d => new Date(d).toLocaleDateString('tr-TR', { day: '2-digit', month: 'long', year: 'numeric' });

  if (inquiryId) {
    fetch(`/api/inquiries/${inquiryId}`)
      .then(r => r.json())
      .then(d => {
        if (!d.success) throw new Error();
        const i = d.data;
        document.getElementById('details').innerHTML = `
          <div class="summary">
            <div class="summary-row"><span class="label">Villa</span><span>${i.villa?.title || '—'}</span></div>
            <div class="summary-row"><span class="label">Giriş</span><span>${fmtDate(i.dates.checkIn)}</span></div>
            <div class="summary-row"><span class="label">Çıkış</span><span>${fmtDate(i.dates.checkOut)}</span></div>
            <div class="summary-row"><span class="label">Ödenen</span><span>${fmt(i.pricing.depositAmount)}</span></div>
            <div class="summary-row total"><span>Eve girişte sahibe</span><span>${fmt(i.pricing.remainingAmount)}</span></div>
          </div>
        `;
        document.getElementById('details').classList.remove('loading');
        document.getElementById('note').style.display = 'block';
      })
      .catch(() => {
        document.getElementById('details').textContent = '';
      });
  } else {
    document.getElementById('details').textContent = '';
  }
</script>

</body>
</html>
