const ARTICLES = currentLang === 'en' ? ARTICLES_EN : ARTICLES_TR;


// Makale listesi render
function renderList() {
  document.getElementById('blog-list').style.display = 'block';
  document.getElementById('article-page').style.display = 'none';
  document.title = 'Villa Tatili Rehberi — bizebivilla Blog';

  document.getElementById('article-list').innerHTML = ARTICLES.map(a => `
    <div class="article-card" onclick="showArticle(${a.id})">
      <div class="article-img"><img src="${a.img}" alt="${a.title}" loading="lazy"></div>
      <div class="article-body">
        <div class="article-tag">${a.tag}</div>
        <div class="article-title"><a href="#" onclick="event.preventDefault();showArticle(${a.id})">${a.title}</a></div>
        <div class="article-excerpt">${a.excerpt}</div>
        <div class="article-meta">
          <span>📅 ${a.date}</span>
          <span>⏱ ${a.readTime}</span>
          <a href="#" class="article-read-more" data-i18n="blog_read_more" onclick="event.preventDefault();event.stopPropagation();showArticle(${a.id})">Devamını oku →</a>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('popular-articles').innerHTML = ARTICLES.slice(0,3).map(a => `
    <div class="sb-article" onclick="showArticle(${a.id})">
      <div class="sb-article-title">${a.title}</div>
      <div class="sb-article-date">${a.date}</div>
    </div>`).join('');
}

function showArticle(id) {
  const a = ARTICLES.find(x=>x.id===id);
  if (!a) return;
  document.getElementById('blog-list').style.display = 'none';
  document.getElementById('article-page').style.display = 'block';
  document.getElementById('ac-tag').textContent = a.tag;
  document.getElementById('ac-title').textContent = a.title;
  document.getElementById('ac-meta').textContent = '📅 ' + a.date + ' · ⏱ ' + a.readTime;
  document.getElementById('ac-img').src = a.img;
  document.getElementById('ac-img').alt = a.title;
  document.getElementById('ac-body').innerHTML = a.content;
  document.title = a.title + ' — bizebivilla Blog';
  window.scrollTo(0,0);

  // Schema.org Article
  const schema = {
    '@context':'https://schema.org','@type':'Article',
    'headline': a.title,
    'description': a.excerpt,
    'image': a.img,
    'datePublished': a.date,
    'author': {'@type':'Organization','name':'bizebivilla'},
    'publisher': {'@type':'Organization','name':'bizebivilla','logo':{'@type':'ImageObject','url':'https://bizebivilla.com/logo.png'}}
  };
  let s = document.getElementById('article-schema');
  if (!s) { s=document.createElement('script'); s.id='article-schema'; s.type='application/ld+json'; document.head.appendChild(s); }
  s.textContent = JSON.stringify(schema);
}

function showList() {
  document.getElementById('blog-list').style.display = 'block';
  document.getElementById('article-page').style.display = 'none';
  document.title = 'Villa Tatili Rehberi — bizebivilla Blog';
}

// URL'den makale slug kontrolü
const articleSlug = new URLSearchParams(window.location.search).get('makale');
if (articleSlug) {
  const a = ARTICLES.find(x=>x.slug===articleSlug);
  if (a) { renderList(); showArticle(a.id); } else renderList();
} else renderList();
